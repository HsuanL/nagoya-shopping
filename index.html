<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ 名古屋戶外外套購物指南</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --accent-color: #e11d48;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
        }

        body {
            background-color: var(--bg-color);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            padding: 25px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0 0 8px 0;
            font-size: 22px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin: 0;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .btn {
            flex: 1;
            white-space: nowrap;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
        }

        .btn.active, .btn:hover {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        .spot-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .spot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .spot-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .tag {
            background: #e0f2fe;
            color: #0369a1;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        .spot-info {
            font-size: 13px;
            color: #475569;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .brand-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .brand-badge {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .brand-badge.highlight {
            background: #ffe4e6;
            border-color: #f43f5e;
            color: #be123c;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🧥 名古屋戶外外套購物地圖</h1>
            <p class="subtitle">針對防水外套（GORE-TEX）、登山裝備精選據點</p>
        </header>

        <div class="btn-group">
            <button class="btn active" onclick="filterArea(event, 'all')">顯示全部</button>
            <button class="btn" onclick="filterArea(event, 'nagoya-station')">名鐵 / 名古屋站</button>
            <button class="btn" onclick="filterArea(event, 'sakae')">榮商圈 (Sakae)</button>
            <button class="btn" onclick="filterArea(event, 'sasashima')">Global Gate</button>
        </div>

        <div id="spotContainer"></div>

        <footer>
            💡 購物小撇步：<br>
            1. 日本購買 CP 值極高：<b>Montbell</b>、<b>Arc'teryx</b> 與 <b>The North Face 紫標</b>。<br>
            2. 結帳時請隨身攜帶<b>護照辦理免稅 (Tax-Free)</b>。
        </footer>
    </div>

    <script>
        var spots = [
            {
                area: "nagoya-station",
                name: "Montbell 名古屋站前店",
                location: "名鐵百貨店 本館 5 樓",
                desc: "日本在地頂級戶外品牌！防水外套（如 Storm Cruiser 採用 GORE-TEX）CP 值極高，版型最適合亞洲人。",
                brands: ["Montbell (齊全)", "免稅手續便利"]
            },
            {
                area: "nagoya-station",
                name: "石井運動 (Ishi Sports) 名古屋店",
                location: "JR ゲートタワー 6 樓",
                desc: "日本老字號專業登山用品連鎖店，專賣硬核登山裝備，現場有多款專業登山 GORE-TEX 外套與鞋款。",
                brands: ["Arc'teryx", "MAMMUT (長毛象)", "Millet", "The North Face"]
            },
            {
                area: "sakae",
                name: "Arc'teryx (始祖鳥) 名古屋品牌店",
                location: "榮商圈 (RAYARD Hisaya-odori Park 附近)",
                desc: "始祖鳥專賣店！防水外套指標 Alpha / Beta 系列最齊全的地方，適合想找高階 GORE-TEX Pro 的朋友。",
                brands: ["Arc'teryx 始祖鳥專賣"]
            },
            {
                area: "sakae",
                name: "The North Face+ 名古屋拉席克店",
                location: "LACHIC 5 樓 (榮商圈)",
                desc: "旗艦級門市，除了標準登山機能外套外，也有販售日本限定的紫標 (Purple Label) 戶外潮流系列。",
                brands: ["The North Face", "TNF 紫標"]
            },
            {
                area: "sakae",
                name: "Patagonia 名古屋專賣店",
                location: "榮商圈 (久屋大通公園東側)",
                desc: "美國經典環保戶外品牌，其 H2No 防水技術外套與雨衣非常著名，店面寬敞齊全。",
                brands: ["Patagonia 專賣店"]
            },
            {
                area: "sasashima",
                name: "A&F COUNTRY Global Gate 店",
                location: "Global Gate 2 樓 (近鐵笹島演奏廳站)",
                desc: "選品極具質感的戶外選品店，引進許多北美與歐洲精緻戶外外套與風格露營裝備。",
                brands: ["KAVU", "Outdoor Research", "選品風格商場"]
            }
        ];

        function renderSpots(filter) {
            var container = document.getElementById('spotContainer');
            container.innerHTML = '';

            var filtered = (filter === 'all') ? spots : spots.filter(function(s) {
                return s.area === filter;
            });

            filtered.forEach(function(s) {
                var badgeHtml = '';
                s.brands.forEach(function(b) {
                    var isHighlight = b.indexOf('Arc') !== -1 || b.indexOf('Montbell') !== -1;
                    badgeHtml += '<span class="brand-badge ' + (isHighlight ? 'highlight' : '') + '">' + b + '</span> ';
                });

                var cardHtml = '<div class="spot-card">' +
                    '<div class="spot-header">' +
                        '<div class="spot-title">' + s.name + '</div>' +
                        '<span class="tag">' + s.location + '</span>' +
                    '</div>' +
                    '<div class="spot-info">' + s.desc + '</div>' +
                    '<div class="brand-list">' + badgeHtml + '</div>' +
                '</div>';

                container.innerHTML += cardHtml;
            });
        }

        function filterArea(evt, areaKey) {
            var buttons = document.querySelectorAll('.btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });
            evt.target.classList.add('active');

            renderSpots(areaKey);
        }

        renderSpots('all');
    </script>

</body>
</html>
